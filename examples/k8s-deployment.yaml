apiVersion: v1
kind: Namespace
metadata:
  name: pyannote-diarization
---
apiVersion: v1
kind: Secret
metadata:
  name: pyannote-api-keys
  namespace: pyannote-diarization
type: Opaque
stringData:
  # Comma-separated keys matching the API_KEYS env var expected by the app.
  API_KEYS: "REPLACE_ME_PRIMARY,REPLACE_ME_SECONDARY_FOR_ROTATION"
---
apiVersion: v1
kind: Secret
metadata:
  name: pyannote-hf-token
  namespace: pyannote-diarization
type: Opaque
stringData:
  # Token for an account that has accepted HF access terms for community-1.
  HF_TOKEN: "REPLACE_ME_HF_TOKEN"
---
# Hugging Face caches under HF_HOME. The image sets HF_HOME=/opt/huggingface by default.
# Mount durable storage there so weights survive pod restarts. No extra cache env is required.
#
# Custom mount path: set volumeMounts.mountPath to e.g. /mnt/hf-cache and add the same value:
#   env: [ { name: HF_HOME, value: "/mnt/hf-cache" } ]
#
# Per-node hostPath: data stays on the worker; use a PV instead if your policy forbids hostPath.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyannote-diarization
  namespace: pyannote-diarization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyannote-diarization
  template:
    metadata:
      labels:
        app: pyannote-diarization
    spec:
      containers:
        - name: pyannote
          # Replace with your published image (Docker Hub or GHCR).
          image: ghcr.io/nkcx/pyannote_fastapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pyannote-hf-token
                  key: HF_TOKEN
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: pyannote-api-keys
                  key: API_KEYS
          volumeMounts:
            - name: model-cache-node
              mountPath: /opt/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
      volumes:
        - name: model-cache-node
          hostPath:
            path: /var/lib/pyannote-diarization/huggingface-cache
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pyannote-diarization
  namespace: pyannote-diarization
spec:
  selector:
    app: pyannote-diarization
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
# Ingress is intentionally minimal: wire TLS, auth at the edge (e.g. Traefik),
# rate limiting, and timeouts — this service only enforces Authorization: Bearer on /diarize.
