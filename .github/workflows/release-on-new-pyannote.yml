name: Release images for new pyannote.audio versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-pyannote-${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: pyannote_fastapi

jobs:
  maybe-release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: pyannote_fastapi
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest pyannote.audio version
        id: pypi
        run: |
          VERSION="$(curl -fsSL https://pypi.org/pypi/pyannote.audio/json | jq -r '.info.version')"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to read pyannote.audio version from PyPI" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=$(echo "${VERSION}" | cut -d. -f1-2)" >> "${GITHUB_OUTPUT}"
          echo "major=$(echo "${VERSION}" | cut -d. -f1)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip build if this version is already on GHCR
        id: check
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}
        run: |
          # buildx imagetools inspect needs no experimental CLI flag and uses
          # the credentials from the GHCR login above.
          if docker buildx imagetools inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "GHCR already has ${IMAGE_REF}; nothing to build."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "GHCR is missing ${IMAGE_REF}; proceeding to build."
          fi

      - name: Configure git user
        if: ${{ steps.check.outputs.exists != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create git tag (if missing) and push
        if: ${{ steps.check.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "Remote tag v${VERSION} already exists; skipping tag push."
          else
            git tag -a "v${VERSION}" -m "pyannote.audio ${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi

      - name: Resolve PyTorch base image
        id: base
        if: ${{ steps.check.outputs.exists != 'true' }}
        env:
          PYANNOTE_VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          BASE="$(scripts/resolve-pytorch-base.sh)"
          echo "pytorch_base=${BASE}" >> "${GITHUB_OUTPUT}"
          echo "PyTorch base image: ${BASE}"

      - name: Build and push (CUDA)
        if: ${{ steps.check.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PYTORCH_BASE=${{ steps.base.outputs.pytorch_base }}
            PYANNOTE_VERSION=${{ steps.pypi.outputs.version }}
            BUILD_DATE=${{ steps.pypi.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major_minor }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Create or update GitHub Release
        if: ${{ steps.check.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pypi.outputs.version }}
          MAJOR_MINOR: ${{ steps.pypi.outputs.major_minor }}
          MAJOR: ${{ steps.pypi.outputs.major }}
          BUILD_DATE: ${{ steps.pypi.outputs.build_date }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat >"${NOTES_FILE}" <<EOF
          Automated build for pyannote.audio ${VERSION} (built ${BUILD_DATE}).

          Upstream changelog: https://github.com/pyannote/pyannote-audio/blob/main/CHANGELOG.md

          ## GHCR

          - https://github.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}/pkgs/container/${IMAGE_NAME}
          - \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION}\` (CUDA)

          Rolling tags also updated: \`${MAJOR_MINOR}\`, \`${MAJOR}\`, \`latest\`.
          EOF

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists; updating notes."
            gh release edit "v${VERSION}" \
              --title "pyannote.audio ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "v${VERSION}" \
              --title "pyannote.audio ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi
